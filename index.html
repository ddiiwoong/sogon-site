<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sogon — 준비 중</title>
<style>
  /* 외부 의존이 없다 — 웹폰트·CDN·JS를 쓰지 않는다. */
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e3e3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #ededed;
      --muted: #9a9a9a;
      --line: #2e2e2e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 32rem; }
  h1 {
    margin: 0 0 4px;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .tag {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  p { margin: 0 0 14px; }
  .en {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1>Sogon</h1>
  <p class="tag">macOS 받아쓰기 도구</p>
  <p>사용 설명서를 다듬는 중입니다. 정리가 끝나면 이 주소에 공개합니다.</p>
  <p class="en">The user guide is being revised and will be published at this address once it is
  ready.</p>
</main>
</body>
</html>
