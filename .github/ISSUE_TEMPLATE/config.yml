# 빈 이슈를 끄면 `/issues/new`가 템플릿 고르는 화면으로 넘어간다 — 랜딩과 설명서의 `문의` 버튼이
# 그 주소를 가리키므로, 이 값이 `true`가 되면 버튼을 누른 사람이 템플릿 없는 빈 양식을 받는다.
# 쓰기 권한이 있는 본인에게는 `Blank issue (Maintainers only)`가 계속 보인다.
blank_issues_enabled: false
contact_links:
