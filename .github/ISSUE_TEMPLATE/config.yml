    url: https://sogon.dev/guide/
    about: 설치·단축키·설정·회의 기록은 설명서에 있습니다.
  - name: 문제 해결 / Troubleshooting
    url: https://sogon.dev/guide/docs/troubleshooting/
    about: 증상별로 먼저 확인할 것이 정리돼 있습니다. 버그를 알리기 전에 여기를 보세요.
  - name: 진단 정보 만들기 / Diagnostics
    url: https://sogon.dev/guide/docs/troubleshooting/diagnostics/
    about: 디버그 로그를 켜고 재현한 뒤 진단 파일 하나로 묶는 방법입니다.
